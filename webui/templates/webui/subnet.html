<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<h2>Subnet Form</h2>

  <form method="post" id="tagvalueForm" data-tagvalue-url="{% url 'ajax_load_tagvalues' %}"
        data-tag-url="{% url 'ajax_load_tags' %}"
        data-labelvalue-url="{% url 'ajax_load_labelvalues' %}"
        data-label-url="{% url 'ajax_load_labels' %}"
        novalidate>
    {% csrf_token %}
      {{ form }}

        {{ tagform.management_form }}
        {{ labelform.management_form }}
    <a href="{% url 'index' %}">Nevermind</a>
      <div class="col-sm-12 col-md-12 col-1g-12">
          --- Tags ---
<div id="input_wrapper" class="input_wrapper">     <button type="submit">Save</button>
<button id="add_btn" class="btn btn-primary add-btn" name="tag">Add Tag</button>
          </div>
          <br>
          --- Labels ---
<div id="input_label_wrapper" class="input_wrapper">    <button type="submit">Save</button>
<button id="add_label_btn" class="btn btn-primary add-btn" name="label">Add Label</button>
</div>
      </div>
  </form>

  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="/static/js/subnet.js"></script>

</body>
</html>
