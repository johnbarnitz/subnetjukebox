% include "webui/ui-top.html" %}
{% if form.errors %}
  {% for field in form %}
    {% for error in field.errors %}
      <div  role="alert" class="alert alert-error">{{ error }}</div>
    {% endfor %}
  {% endfor %}
  {% for error in form.non_field_errors %}
    <div role="alert" class="alert alert-error">{{ error }}</div>
  {% endfor %}
{% endif %}

    <!-- Form to submit the formset data -->
    <form method="post">
        {% csrf_token %}


       {{ form }}

    </form>
