{% include "webui/ui-top.html" with user=user %}
<div class="flex justify-center ">
    <p>{{ message }}</p>
    <form method="post">

        {% csrf_token %}
    <div class="form-row grid grid-cols-3 gap-4 pb-8">
    {% for field in form %}
        <div class="..." >{{ field.label_tag }} </div>
        <div class="col-span-2 ..." >{{ field }} </div>
    {% endfor %}
    </div>
        <button class="btn btn-primary" type="submit" >Submit</button>
    </form>
</div>
{% include "webui/ui-bottom.html" %}
